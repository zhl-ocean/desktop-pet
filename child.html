<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"
    />
    <title>陪伴小人</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
        -webkit-user-drag: none;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      #stage {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        padding: 4px 6px 2px;
        box-sizing: border-box;
      }
      #bubble {
        max-width: 92%;
        margin-bottom: 4px;
        padding: 5px 9px;
        border-radius: 12px;
        background: #fff;
        border: 2px solid #1a1a1a;
        color: #1a1a1a;
        font: 600 12px/1.35 "Segoe UI", "PingFang SC", "Microsoft YaHei",
          sans-serif;
        opacity: 0;
        transform: translateY(6px) scale(0.92);
        transition: opacity 0.18s ease, transform 0.18s ease;
        pointer-events: none;
        text-align: center;
        white-space: nowrap;
      }
      #bubble.visible {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      #wrap {
        flex: 1;
        width: 100%;
        min-height: 0;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        transform-origin: center bottom;
        overflow: visible;
      }
      #wrap.flip #boy {
        transform: scaleX(-1);
      }
      #wrap.chase #boy {
        animation: chase-bob 0.48s ease-in-out infinite;
      }
      #wrap.idle-sway #boy {
        animation: idle-sway 2.4s ease-in-out infinite;
      }
      #wrap.cheer #boy {
        animation: cheer-bounce 0.7s ease;
      }
      #wrap.reach #boy {
        animation: reach-lean 0.9s ease;
      }
      #wrap.act-bob #boy {
        animation: act-bob 0.9s ease;
      }
      #boy {
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: 100%;
        object-fit: contain;
        object-position: bottom center;
        filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.18));
        pointer-events: none;
        transform-origin: center bottom;
      }
      @keyframes chase-bob {
        0%,
        100% {
          translate: 0 0;
        }
        40% {
          translate: 0 -2%;
        }
        55% {
          translate: 0 0.5%;
        }
      }
      @keyframes idle-sway {
        0%,
        100% {
          translate: 0 0;
          rotate: 0deg;
        }
        50% {
          translate: 0 -1.5%;
          rotate: 1deg;
        }
      }
      @keyframes cheer-bounce {
        0%,
        100% {
          translate: 0 0;
          scale: 1 1;
        }
        30% {
          translate: 0 -12%;
          scale: 0.96 1.06;
        }
        55% {
          translate: 0 2%;
          scale: 1.04 0.94;
        }
      }
      @keyframes reach-lean {
        0%,
        100% {
          translate: 0 0;
          rotate: 0deg;
        }
        40% {
          translate: 8% -4%;
          rotate: 6deg;
        }
        70% {
          translate: 10% -2%;
          rotate: 8deg;
        }
      }
      @keyframes act-bob {
        0%,
        100% {
          translate: 0 0;
          scale: 1 1;
        }
        35% {
          translate: 0 -4%;
          scale: 0.98 1.02;
        }
        60% {
          translate: 0 1%;
          scale: 1.01 0.99;
        }
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="bubble" aria-hidden="true"></div>
      <div id="wrap">
        <img id="boy" src="assets/boy/idle.png" alt="小孩" draggable="false" />
      </div>
    </div>
    <script src="child-renderer.js"></script>
  </body>
</html>
